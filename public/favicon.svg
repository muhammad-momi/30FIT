<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16191f" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.2" />

  <!-- Outer circular progress ring decoration -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#262c36" stroke-width="14" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#limeGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="800 400" transform="rotate(-90 256 256)" filter="url(#glow)" />

  <!-- Lightning / dynamic bolt symbol -->
  <path d="M 276 112 L 204 260 L 260 260 L 236 400 L 328 232 L 272 232 Z" fill="url(#limeGrad)" filter="url(#glow)" />

  <!-- Text 30FIT -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">30<tspan fill="#a3e635">FIT</tspan></text>
</svg>
